name: Build

on:
  push:
    branches:
      - legacy/demo
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.6
  LIME_VERSION: 8.3.2
  OPENFL_VERSION: 9.5.2
  FLIXEL_VERSION: 5.2.2
  FLIXEL_ADDONS_VERSION: 3.0.2

jobs:
  android:
    name: Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Android packages
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Add NDK strip aliases
        run: |
          NDK_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for TRIPLE in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi x86_64-linux-android i686-linux-android; do
            ln -sf "$NDK_BIN/llvm-strip" "$NDK_BIN/$TRIPLE-strip"
          done
          echo "$NDK_BIN" >> "$GITHUB_PATH"

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          yes | haxelib install hxcpp 4.3.2
          yes | haxelib install lime ${{ env.LIME_VERSION }}
          yes | haxelib install openfl ${{ env.OPENFL_VERSION }}
          yes | haxelib install flixel ${{ env.FLIXEL_VERSION }}
          yes | haxelib install flixel-addons ${{ env.FLIXEL_ADDONS_VERSION }}
          yes | haxelib install flixel-ui 2.6.5
          yes | haxelib install hscript 2.7.0
          haxelib list

      - name: Configure Lime
        run: |
          haxelib run lime setup -y
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_PATH "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pibby-apocalypse-android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # krdlab/setup-haxe fails here: the haxelib in Haxe's macOS build only looks for libneko.2.dylib in
      # /usr/local/lib, and the action runs `haxelib setup` before we can put it there. So install by hand.
      - name: Setup Haxe
        run: |
          mkdir -p "$HOME/haxe-install" && cd "$HOME/haxe-install"
          mkdir neko haxe
          curl -fsSL "https://github.com/HaxeFoundation/neko/releases/download/v2-3-0/neko-2.3.0-osx64.tar.gz" | tar xz -C neko --strip-components=1
          curl -fsSL "https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx.tar.gz" | tar xz -C haxe --strip-components=1
          sudo mkdir -p /usr/local/lib
          sudo ln -sf "$PWD/neko/libneko.2.dylib" /usr/local/lib/libneko.2.dylib
          echo "$PWD/haxe" >> "$GITHUB_PATH"
          echo "$PWD/neko" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=$PWD/haxe/std" >> "$GITHUB_ENV"
          echo "NEKOPATH=$PWD/neko" >> "$GITHUB_ENV"
          export PATH="$PWD/haxe:$PWD/neko:$PATH" NEKOPATH="$PWD/neko" HAXE_STD_PATH="$PWD/haxe/std"
          haxe --version
          haxelib --version

      - name: Install Haxe libraries
        run: |
          haxelib setup ~/haxelib
          yes | haxelib install hxcpp 4.3.2
          yes | haxelib install lime ${{ env.LIME_VERSION }}
          yes | haxelib install openfl ${{ env.OPENFL_VERSION }}
          yes | haxelib install flixel ${{ env.FLIXEL_VERSION }}
          yes | haxelib install flixel-addons ${{ env.FLIXEL_ADDONS_VERSION }}
          yes | haxelib install flixel-ui 2.6.5
          yes | haxelib install hscript 2.7.0
          haxelib list

      - name: Configure Lime
        run: haxelib run lime setup -y

      - name: Build
        run: haxelib run lime build ios -nosign -final

      - name: Package IPA
        run: |
          APP_PATH=$(find export/release/ios -maxdepth 6 -name "*.app" -type d | head -n 1)
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -qry ../PibbyApocalypse.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pibby-apocalypse-ios
          path: PibbyApocalypse.ipa
          if-no-files-found: error
